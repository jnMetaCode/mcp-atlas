name: 真实任务试用记录
description: 带一个具体任务试用，记录结果与卡点，不把浏览或复制视为接入成功
title: "[任务试用] "
body:
  - type: markdown
    attributes:
      value: |
        这是公开 GitHub Issue，自愿填写。不要上传密钥、私人配置、公司数据或未脱敏日志。
        请先选自己的真实任务，再尝试网站。完成多少就记录多少；失败和放弃同样有价值。
        本表记录参与者自述，不自动成为本站的已实测认证，也不能用于推算全部访客的成功率。
  - type: input
    id: role
    attributes:
      label: 你的使用角色
      placeholder: 例如独立开发者、前端工程师；无需姓名或公司
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: 这次原本要完成什么具体任务？
      description: 说明任务和成功标准，不要只写想看看有什么工具。
      placeholder: 例如在测试项目中读取一个公开仓库的 issue 列表。
    validations:
      required: true
  - type: textarea
    id: previous
    attributes:
      label: 如果没有本站，你原本会怎么完成？
      description: 可以描述搜索、阅读文档、已有工具或不处理；不需要证明本站有帮助。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 客户端和环境
      placeholder: 客户端名称与版本、操作系统；不要填写账号和连接串
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: 最终实际做到哪一步？
      options:
        - 只浏览，尚未选择项目
        - 未找到适合的项目
        - 选定项目，阅读或复制了配置，未安装连接
        - 尝试安装或连接，未成功
        - 已连接或启用技能，但未完成预期任务
        - 已完成预期的小任务（参与者自述）
        - 无法判断或中途停止
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果与卡点
      description: 成功时描述执行了什么及如何判断；失败时记录卡在哪一步、是否需要别人帮助。截图和脱敏日志均可选。
    validations:
      required: true
  - type: dropdown
    id: value
    attributes:
      label: 对这次任务，本站提供了什么帮助？
      options:
        - 帮助选择了实现
        - 帮助理解或完成配置
        - 两者都有
        - 没有帮助
        - 无法判断
    validations:
      required: true
  - type: dropdown
    id: cross_use
    attributes:
      label: 这次任务是否同时需要 MCP 和 Skills？
      options:
        - 只需要 MCP
        - 只需要 Skills
        - 两者都有实际需要
        - 都不需要或无法判断
  - type: textarea
    id: return
    attributes:
      label: 后续再次使用记录（可选）
      description: 如果七天内有新的真实任务，可以回来补充日期和任务。没有回来不自动视为流失；不要用预计会回来替代实际记录。
