name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SITE_URL: https://jnmetacode.github.io
      NEXT_PUBLIC_BASE_PATH: /mcp-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:dom
      - run: npm run build
      - run: npm run check:export
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p /tmp/pages-preview/mcp-atlas && cp -R out/. /tmp/pages-preview/mcp-atlas/
      - run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_STATIC_ROOT: /tmp/pages-preview
          PLAYWRIGHT_PORT: 4199
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
